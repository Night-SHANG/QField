---
name: 🚰 发布供水巡检正式 APK

on:
  push:
    branches:
      - publish/waterworks-inspection-apk

permissions:
  contents: write
  actions: read

concurrency:
  group: waterworks-inspection-release
  cancel-in-progress: false

jobs:
  publish:
    name: 发布 APK 到 GitHub Release
    runs-on: ubuntu-24.04
    env:
      SOURCE_RUN_ID: "36089305719"
      RELEASE_TARGET_SHA: "60dae4b4e682ace5b12728113089e796cbdab1d5"
      RELEASE_TAG: "waterworks-inspection-v1.1.0"
      RELEASE_TITLE: "供水巡检 v1.1.0"
    steps:
      - name: Download verified Android artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT_ID: "10844464981"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" > /tmp/waterworks-artifact.zip
          unzip -q /tmp/waterworks-artifact.zip -d dist
          test -s dist/waterworks-inspection-arm64-debug.apk
          mv dist/waterworks-inspection-arm64-debug.apk dist/waterworks-inspection-arm64-v1.1.0.apk

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/waterworks-inspection-arm64-v1.1.0.apk"
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${APK}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${APK}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${RELEASE_TARGET_SHA}" \
              --title "${RELEASE_TITLE}" \
              --latest \
              --notes "供水巡检 v1.1.0 正式版。基于 v1.0.0 继续完善附件与备份流程：附件可在应用内直接删除；新增应用内文字记录，可新建、查看和编辑；项目备份按完整项目目录导出 ZIP，项目数据以及照片、视频、录音、文档等附件会一并打包；同时修复查找筛选下拉菜单、删除确认、文字记录与备份/恢复弹窗被页面遮挡的 UI 层级问题。对应源码提交：${RELEASE_TARGET_SHA}。"
          fi
