---
name: 🚰 发布供水巡检测试 APK

on:
  push:
    branches:
      - publish/waterworks-inspection-apk

permissions:
  contents: write
  actions: read

concurrency:
  group: waterworks-inspection-release
  cancel-in-progress: false

jobs:
  publish:
    name: 发布 APK 到 GitHub Release
    runs-on: ubuntu-24.04
    env:
      SOURCE_RUN_ID: "35805404320"
      RELEASE_TARGET_SHA: "2dcbee1d5730e69327aca41cd985797de1bd9478"
      RELEASE_TAG: "waterworks-inspection-test-2dcbee1"
      RELEASE_TITLE: "供水巡检测试版 2dcbee1"
    steps:
      - name: Download successful Android artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "${SOURCE_RUN_ID}"             --repo "${GITHUB_REPOSITORY}"             --name waterworks-inspection-arm64-debug             --dir dist
          test -s dist/waterworks-inspection-arm64-debug.apk

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/waterworks-inspection-arm64-debug.apk"
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${APK}"               --repo "${GITHUB_REPOSITORY}"               --clobber
          else
            gh release create "${RELEASE_TAG}" "${APK}"               --repo "${GITHUB_REPOSITORY}"               --target "${RELEASE_TARGET_SHA}"               --title "${RELEASE_TITLE}"               --prerelease               --notes "ARM64 Debug 测试 APK。包含 OSM / 天地图矢量 / 天地图影像底图切换，以及本轮点位类型中文显示、附件媒体保存和拍照自动确认修复。对应提交：${RELEASE_TARGET_SHA}。"
          fi
