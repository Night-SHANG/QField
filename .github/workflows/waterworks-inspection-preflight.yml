---
name: 🚰 供水巡检 Preflight

on:
  push:
    branches:
      - feature/waterworks-inspection
    paths:
      - 'custom/waterworks-inspection/**'
      - 'CMakeLists.txt'
      - 'src/app/CMakeLists.txt'
      - 'src/app/qml/QgisMobileapp.qml'
      - 'src/app/qml/QfWelcomeScreen.qml'
      - 'src/core/qfgeometry.h'
      - 'src/core/utils/qffileutils.h'
      - 'src/core/utils/qffileutils.cpp'
      - 'src/core/utils/qflayerutils.h'
      - 'src/core/utils/qflayerutils.cpp'
      - 'src/gui/qml/QfFeatureListForm.qml'
      - 'src/gui/qml/QfNavigationBar.qml'
      - 'src/gui/qml/QfCamera.qml'
      - 'src/gui/qml/QfCamera.qml'
      - 'src/core/qfgeometry.h'
      - 'src/core/utils/qffileutils.h'
      - 'src/core/utils/qffileutils.cpp'
      - '.github/workflows/waterworks-inspection-preflight.yml'
      - '.github/workflows/waterworks-inspection-android.yml'
  pull_request:
    paths:
      - 'custom/waterworks-inspection/**'
      - 'CMakeLists.txt'
      - 'src/app/CMakeLists.txt'
      - 'src/app/qml/QgisMobileapp.qml'
      - 'src/app/qml/QfWelcomeScreen.qml'
      - 'src/core/utils/qflayerutils.h'
      - 'src/core/utils/qflayerutils.cpp'
      - 'src/gui/qml/QfFeatureListForm.qml'
      - 'src/gui/qml/QfNavigationBar.qml'
      - '.github/workflows/waterworks-inspection-preflight.yml'
      - '.github/workflows/waterworks-inspection-android.yml'
  workflow_dispatch:

concurrency:
  group: waterworks-inspection-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: 数据与业务配置测试
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false
      - name: Compile Python and run all waterworks tests
        shell: bash
        run: |
          set +e

          python3 -m compileall -q \
            custom/waterworks-inspection/tools \
            custom/waterworks-inspection/tests
          compile_status=$?

          python3 -m unittest discover \
            -s custom/waterworks-inspection/tests \
            -p 'test_*.py' \
            -v
          test_status=$?

          if [[ ${compile_status} -ne 0 || ${test_status} -ne 0 ]]; then
            exit 1
          fi

  theme-json:
    name: 主题 JSON 检查
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false
      - name: Validate theme JSON
        run: python3 -m json.tool custom/waterworks-inspection/theme.json >/dev/null

  structure:
    name: 专用层结构检查
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false
      - name: Verify required project files and build hooks
        shell: bash
        run: |
          set -u
          failures=0

          for path in \
            custom/waterworks-inspection/README.md \
            custom/waterworks-inspection/theme.json \
            custom/waterworks-inspection/plugins/waterworks-inspection/main.qml \
            custom/waterworks-inspection/plugins/waterworks-inspection/metadata.txt \
            custom/waterworks-inspection/schema/README.md \
            custom/waterworks-inspection/tools/create_geopackage.py \
            custom/waterworks-inspection/tools/configure_qgis_project.py \
            custom/waterworks-inspection/tools/build_project_bundle.py
          do
            if [[ ! -f "${path}" ]]; then
              echo "::error::Missing required file: ${path}"
              failures=$((failures + 1))
            fi
          done

          grep -q 'objectName: "waterworksInspectionPlugin"' \
            custom/waterworks-inspection/plugins/waterworks-inspection/main.qml || {
              echo "::error::Waterworks plugin root object is missing"
              failures=$((failures + 1))
            }

          grep -q 'APP_BUNDLED_PLUGINS' CMakeLists.txt || {
            echo "::error::Bundled plugin build option is missing"
            failures=$((failures + 1))
          }

          grep -q 'APP_THEME_PATH' src/app/CMakeLists.txt || {
            echo "::error::Custom theme build hook is missing"
            failures=$((failures + 1))
          }

          grep -q 'objectName: "gnssButton"' src/app/qml/QgisMobileapp.qml || {
            echo "::error::GNSS button plugin hook is missing"
            failures=$((failures + 1))
          }

          grep -q 'objectName: "welcomeScreen"' src/app/qml/QfWelcomeScreen.qml || {
            echo "::error::Welcome screen plugin hook is missing"
            failures=$((failures + 1))
          }

          grep -q 'Q_INVOKABLE QgsGeometry asQgsGeometry() const' src/core/qfgeometry.h || {
            echo "::error::Captured geometry QML hook is missing"
            failures=$((failures + 1))
          }

          grep -q 'Q_INVOKABLE static bool copyFile' src/core/utils/qffileutils.h || {
            echo "::error::Bundled project template copy helper is missing"
            failures=$((failures + 1))
          }

          grep -q 'Q_INVOKABLE static bool configureField' src/core/utils/qflayerutils.h || {
            echo "::error::Runtime layer form configuration hook is missing"
            failures=$((failures + 1))
          }

          grep -q 'objectName: "locationMarker"' src/app/qml/QgisMobileapp.qml || {
            echo "::error::Location marker visibility hook is missing"
            failures=$((failures + 1))
          }

          grep -q 'objectName: "waterworksBottomActionBar"' custom/waterworks-inspection/plugins/waterworks-inspection/main.qml || {
            echo "::error::Map-first field action bar is missing"
            failures=$((failures + 1))
          }

          grep -q 'property bool editEnabled: false' custom/waterworks-inspection/plugins/waterworks-inspection/main.qml || {
            echo "::error::Persistent view/edit lock is missing"
            failures=$((failures + 1))
          }

          grep -q 'Q_INVOKABLE static int selectFeaturesByExpression' src/core/utils/qflayerutils.h || {
            echo "::error::Map query highlighting hook is missing"
            failures=$((failures + 1))
          }

          grep -q 'Q_INVOKABLE static int deleteFeaturesByExpression' src/core/utils/qflayerutils.h || {
            echo "::error::Committed expression deletion hook is missing"
            failures=$((failures + 1))
          }

          grep -q '!isSuccess && ( !wasEditing || !flushBuffer )' src/core/utils/qflayerutils.cpp || {
            echo "::error::Failed deletion rollback guard is missing"
            failures=$((failures + 1))
          }

          grep -q 'enabled: toolBar.allowDelete &&' src/gui/qml/QfNavigationBar.qml || {
            echo "::error::Native feature delete lock is not enforced"
            failures=$((failures + 1))
          }

          grep -q 'enabled: toolBar.allowProcessing &&' src/gui/qml/QfNavigationBar.qml || {
            echo "::error::Native processing visibility lock is not enforced"
            failures=$((failures + 1))
          }

          grep -q 'property bool allowProcessing: true' src/gui/qml/QfFeatureListForm.qml || {
            echo "::error::Feature processing visibility hook is missing"
            failures=$((failures + 1))
          }

          grep -q 'objectName: "waterworksAttachmentDrawer"' custom/waterworks-inspection/plugins/waterworks-inspection/main.qml || {
            echo "::error::Attachment browser is missing"
            failures=$((failures + 1))
          }

          grep -q 'property bool autoAcceptPhoto: false' src/gui/qml/QfCamera.qml || {
            echo "::error::Specialised photo auto-accept hook is missing"
            failures=$((failures + 1))
          }

          grep -q 'function saveCapturedAttachment(sourcePath, mediaType)' custom/waterworks-inspection/plugins/waterworks-inspection/main.qml || {
            echo "::error::Direct media attachment capture is missing"
            failures=$((failures + 1))
          }

          grep -q 'function assetTypeValueMap()' custom/waterworks-inspection/plugins/waterworks-inspection/main.qml || {
            echo "::error::Runtime asset type value mapping is missing"
            failures=$((failures + 1))
          }

          grep -q 'objectName: "waterworksPipelineDigitizingHint"' custom/waterworks-inspection/plugins/waterworks-inspection/main.qml || {
            echo "::error::Pipeline digitizing guidance is missing"
            failures=$((failures + 1))
          }

          grep -q 'objectName: "gnssTrackingButton"' src/app/qml/QgisMobileapp.qml || {
            echo "::error::GNSS tracking visibility hook is missing"
            failures=$((failures + 1))
          }

          grep -q 'cmakeVersion: 3.31.6'             .github/workflows/waterworks-inspection-android.yml || {
              echo "::error::Waterworks Android workflow must pin CMake 3.31.6"
              failures=$((failures + 1))
            }

          if grep -q 'cmake-3.31.6-linux-x86_64.sh'             .github/workflows/waterworks-inspection-android.yml; then
            echo "::error::Do not reinstall CMake with a manual wget step"
            failures=$((failures + 1))
          fi

          grep -q 'sha256sum /tmp/waterworks-inspection-arm64-debug.apk'             .github/workflows/waterworks-inspection-android.yml || {
              echo "::error::APK checksum verification is missing"
              failures=$((failures + 1))
            }

          grep -q 'waterworks-template.gpkg'             .github/workflows/waterworks-inspection-android.yml || {
              echo "::error::Bundled waterworks data template generation is missing"
              failures=$((failures + 1))
            }

          exit "${failures}"
